name: Publish to GitHub Packages

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish Package to GitHub Registry
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GH_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      # pnpm is not pre-installed on ubuntu-latest runners; Volta manages node only.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # --no-git-checks: this job runs on a tag push (detached HEAD), and pnpm
      # publish otherwise refuses because the current branch isn't the publish branch.
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          CI: true
